name: Opportunity Operations

on:
  push:
    branches: ["production-v3"]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunity-operations
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: pytest -q

      - name: Run engine
        env:
          RUNTIME_ENV: PRODUCTION
          DB_PATH: data/opportunities.db
          DRY_RUN: "true"
        run: python engine.py

      - name: Persist runtime database
        run: |
          git config user.name "opportunity-operations[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.db
          git diff --cached --quiet || git commit -m "chore: update opportunity state [skip ci]"
          git push
